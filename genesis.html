<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Genesis — From Black Hole to Big Bang to Milky Way</title>
<style>
:root{--ink:#e9eef8;--dim:rgba(210,222,245,.58);--hot:#ffb067;--line:rgba(255,190,120,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
 font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#c.drag{cursor:grabbing}
.ui{position:fixed;z-index:10;transition:opacity 1.2s ease}
.hide{opacity:0!important;pointer-events:none!important}
#brand{top:26px;left:30px}
#brand h1{font-size:13px;font-weight:300;letter-spacing:.55em;text-transform:uppercase}
#brand p{margin-top:7px;font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
#clock{top:26px;right:30px;text-align:right}
#clock .k{font-size:9px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
#clock .v{margin-top:6px;font-size:20px;font-weight:200;letter-spacing:.12em;color:var(--hot);font-variant-numeric:tabular-nums}
#caption{left:30px;bottom:34px;max-width:min(560px,78vw)}
#caption .t{font-size:clamp(18px,2.4vw,30px);font-weight:200;letter-spacing:.14em}
#caption .s{margin-top:10px;font-size:clamp(11px,1.1vw,14px);line-height:1.7;color:var(--dim);letter-spacing:.06em}
#caption .t,#caption .s{transition:opacity .9s ease,transform .9s ease}
#caption.swap .t,#caption.swap .s{opacity:0;transform:translateY(8px)}
#home{left:50%;bottom:11vh;transform:translateX(-50%);text-align:center}
#bang{pointer-events:auto;cursor:pointer;background:rgba(10,8,6,.35);color:#fff;border:1px solid rgba(255,176,103,.55);
 padding:15px 34px;font:300 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.45em;text-transform:uppercase;border-radius:40px;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 38px rgba(255,150,60,.18);transition:.35s}
#bang:hover{background:rgba(255,150,60,.16);border-color:#ffb067;box-shadow:0 0 60px rgba(255,150,60,.4);letter-spacing:.52em}
#hint{margin-top:16px;font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
#bar{right:76px;bottom:30px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease}
#bar.open{opacity:1;pointer-events:auto;transform:none}
#peek{position:fixed;right:30px;bottom:30px;z-index:11;width:34px;height:34px;border-radius:50%;cursor:pointer;pointer-events:auto;background:rgba(10,12,18,.35);border:1px solid var(--line);color:var(--dim);font:400 14px/32px "Helvetica Neue",Arial,sans-serif;text-align:center;opacity:.45;transition:opacity .3s,border-color .3s}
#peek:hover,#peek.on{opacity:1;border-color:var(--hot)}
.pill{pointer-events:auto;cursor:pointer;background:rgba(10,12,18,.5);border:1px solid var(--line);color:var(--ink);
 padding:9px 15px;font:400 10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;border-radius:30px;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.25s}
.pill:hover{border-color:var(--hot);background:rgba(255,150,60,.14)}
#gfx{pointer-events:auto;position:fixed;right:30px;bottom:78px;z-index:20;width:262px;padding:18px;border-radius:16px;
 background:rgba(8,10,16,.82);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 transition:opacity .3s,transform .3s}
#gfx.closed{opacity:0;transform:translateY(8px);pointer-events:none}
#gfx h3{font-size:10px;letter-spacing:.32em;text-transform:uppercase;font-weight:400;color:var(--hot);margin-bottom:12px}
#gfx .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#gfx button{cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:var(--ink);padding:10px 6px;
 border-radius:9px;font:400 10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;transition:.2s}
#gfx button:hover{border-color:var(--hot)}
#gfx button.on{background:rgba(255,150,60,.2);border-color:var(--hot);color:#fff}
#gfx p{margin-top:12px;font-size:10px;line-height:1.6;color:var(--dim);letter-spacing:.04em}
#fps{margin-top:10px;font-size:10px;letter-spacing:.2em;color:var(--dim);font-variant-numeric:tabular-nums}
#err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:40px;background:#000;
 color:#ffb4a0;font:13px/1.6 monospace;white-space:pre-wrap}
@media(max-width:700px){#brand{top:16px;left:16px}#clock{top:16px;right:16px}#caption{left:16px;bottom:78px}
 #bar{right:56px;bottom:16px;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 70px)}#peek{right:12px;bottom:16px}.pill{padding:8px 10px;font-size:9px}#gfx{right:12px;bottom:62px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>

<div id="brand" class="ui"><h1>Genesis</h1><p id="sub">Gargantua · Schwarzschild geodesics</p></div>
<div id="clock" class="ui hide"><div class="k">Cosmic time</div><div class="v" id="clockv">—</div></div>
<div id="caption" class="ui hide"><div class="t" id="capt"></div><div class="s" id="caps"></div></div>

<div id="home" class="ui">
  <button id="bang">Initiate Big Bang</button>
  <div id="hint">Drag to orbit · Scroll to zoom</div>
</div>

<div id="bar" class="ui">
  <button class="pill hide" id="skip">Skip chapter ▸▸</button>
  <button class="pill hide" id="replay">Replay</button>
  <button class="pill" id="snd">Sound on</button>
  <button class="pill" id="gbtn">Graphics: High</button>
</div>

<button id="peek" aria-label="Show controls">⋯</button>

<div id="gfx" class="closed">
  <h3>Graphics</h3>
  <div class="row">
    <button data-q="low">Low</button><button data-q="medium">Medium</button>
    <button data-q="high">High</button><button data-q="extreme">Extreme</button>
  </div>
  <p id="gdesc"></p>
  <div id="fps"></div>
</div>

<script>
"use strict";
/* ============================ CORE ============================ */
const $=id=>document.getElementById(id);
const canvas=$('c');
function fatal(msg){const e=$('err');e.style.display='flex';e.textContent=msg;}
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
if(!gl){fatal('WebGL2 is required for this experience.\nPlease use a current version of Chrome, Edge, Firefox or Safari with hardware acceleration enabled.');throw new Error('no webgl2');}
const extCBF=gl.getExtension('EXT_color_buffer_float');
const extCBH=gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const HDR=!!(extCBF||extCBH);
const RT_IFMT=HDR?gl.RGBA16F:gl.RGBA8, RT_TYPE=HDR?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;

const QUALITY={
 low:    {name:'Low',    scale:.55,dpr:1,   steps:130,vol:0,bloom:0,web:40000, mw:90000,  dust:3000,  gal:140,fb:3,aa:0,desc:'Lightweight. Reduced resolution, no bloom, fewer stars. For integrated GPUs and phones.'},
 medium: {name:'Medium', scale:.8, dpr:1.25,steps:210,vol:0,bloom:3,web:130000,mw:260000, dust:9000,  gal:260,fb:4,aa:0,desc:'Balanced. Bloom, volumetric glow and a rich star count.'},
 high:   {name:'High',   scale:1,  dpr:1.5, steps:320,vol:1,bloom:5,web:320000,mw:600000, dust:20000, gal:420,fb:5,aa:0,desc:'Cinematic. Full resolution, volumetric accretion gas, deep bloom.'},
 extreme:{name:'Extreme',scale:1,  dpr:2,   steps:520,vol:1,bloom:6,web:700000,mw:1400000,dust:40000, gal:700,fb:6,aa:1,desc:'Maximum. Native-density rendering, 2-sample ray supersampling, 1.4M star galaxy. Needs a strong GPU.'}
};
let qKey='high';
try{const s=localStorage.getItem('genesis.q');if(s&&QUALITY[s])qKey=s;else if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent))qKey='medium';}catch(e){}
let Q=QUALITY[qKey];

function compile(type,src,label){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    const num=src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n');
    console.error(label+'\n'+log+'\n'+num);
    throw new Error('Shader compile failed ['+label+']: '+log);
  }
  return s;
}
function program(vs,fs,label,defs){
  const pre='#version 300 es\n'+(defs||'');
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,pre+vs,label+' VS'));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,pre+fs,label+' FS'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('Link failed ['+label+']: '+gl.getProgramInfoLog(p));
  const U={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name);}
  return {p,U};
}
function createRT(w,h,linear){
  w=Math.max(1,w|0);h=Math.max(1,h|0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,RT_IFMT,w,h,0,gl.RGBA,RT_TYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {tex,fb,w,h};
}
function freeRT(r){if(!r)return;gl.deleteTexture(r.tex);gl.deleteFramebuffer(r.fb);}
const emptyVAO=gl.createVertexArray();

/* ---- math ---- */
const M={
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=1/(n-fa);return new Float32Array([t/a,0,0,0, 0,t,0,0, 0,0,(n+fa)*r,-1, 0,0,2*n*fa*r,0]);},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return {m:new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]),
   right:[xx,xy,xz],up:[yx,yy,yz],fwd:[-zx,-zy,-zz]};},
 mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
 clamp:(x,a,b)=>Math.min(b,Math.max(a,x)),
 mix:(a,b,t)=>a+(b-a)*t,
 sstep(a,b,x){const t=M.clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);},
 ease:t=>{t=M.clamp(t,0,1);return t*t*(3-2*t);}
};
/* ===================== GLSL: shared library ===================== */
const GLSL_COMMON=`
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash31(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yxx)*p3.zyx);}
float vnoise(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm3(vec3 p,int oct){
  float v=0.,a=.5;
  for(int i=0;i<7;i++){ if(i>=oct)break; v+=a*vnoise(p); p=p*2.03+vec3(11.7,3.1,7.3); a*=.5; }
  return v/(1.-pow(.5,float(oct)));
}
vec3 blackbody(float T){
  T=clamp(T,1000.,40000.)/100.;
  vec3 c;
  c.r=T<=66.?1.:clamp(1.292936186*pow(T-60.,-.1332047592),0.,1.);
  c.g=T<=66.?clamp(.3900815788*log(T)-.6318414438,0.,1.):clamp(1.129890861*pow(T-60.,-.0755148492),0.,1.);
  c.b=T>=66.?1.:(T<=19.?0.:clamp(.5432067891*log(T-10.)-1.19625408914,0.,1.));
  return pow(c,vec3(2.2));
}
mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
`;
/* shared vertex helpers: integer hashing for GPU-generated particles */
const GLSL_PCG=`
uint pcg(uint v){uint s=v*747796405u+2891336053u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float rnd(uint id,uint k){return float(pcg(id*1664525u+k*1013904223u+k))/4294967295.0;}
`;
const FS_TRI=`
out vec2 vUV;
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUV=p; gl_Position=vec4(p*2.-1.,0.,1.); }
`;
/* ===================== GLSL: Schwarzschild black hole ===================== */
const BH_FS=`
precision highp float;precision highp int;
in vec2 vUV;
uniform vec2 u_res;uniform float u_time;
uniform vec3 u_cam,u_right,u_up,u_fwd;
uniform float u_th,u_m,u_gal,u_expo,u_disk;
uniform int u_steps,u_vol,u_aa;
out vec4 o;
`+GLSL_COMMON+`
#define RIN 3.0
#define ROUT 14.0
#define RB 110.0

/* ---- sky: procedural stars + Milky Way (dense golden core when u_gal -> 1) ---- */
vec3 starLayer(vec3 d,float N,float dens,float pixA,float seed,float bright){
  vec3 pp=d*N;vec3 cell=floor(pp);vec3 f=pp-cell;
  if(hash31(cell+seed)>dens)return vec3(0.);
  vec3 o3=.2+.6*hash33(cell+seed*3.7);
  vec3 dv=f-o3;dv-=d*dot(dv,d);
  float base=.055;
  float sig=min(max(base,pixA*N*.7),.13);
  float mag=pow(hash31(cell*1.7+seed*9.1),5.);
  float fall=exp(-dot(dv,dv)/(2.*sig*sig));
  float flux=bright*(.12+mag*16.)*(base*base)/(sig*sig);
  vec3 c=blackbody(mix(3000.,13000.,pow(hash31(cell+17.3),.8)));
  return c*fall*flux;
}
vec3 sky(vec3 d,float pixA){
  float G=u_gal;
  vec3 NG=normalize(vec3(.35,.82,.45));
  vec3 ex=normalize(cross(NG,vec3(0.,0.,1.)));vec3 ey=cross(NG,ex);
  float b=dot(d,NG);
  float width=mix(.16,.55,G);
  float band=exp(-b*b/(2.*width*width));
  float cl=fbm3(d*4.+3.,5),cl2=fbm3(d*12.,3);
  float dn=band*(.3+1.0*cl);
  float bulge=exp(-(1.-dot(d,ex))*mix(7.,1.4,G));
  float dl=abs(fbm3(d*6.5+9.,5)-.5)*2.;
  float dust=smoothstep(.34,.0,dl)*exp(-b*b/(2.*width*width*.2))*.88;
  vec3 mw=vec3(.50,.58,.85)*dn*.075+vec3(1.,.70,.40)*bulge*(.25+band)*.11*mix(1.,2.5,G);
  mw+=vec3(.9,.45,.5)*pow(cl2,3.)*band*.03*(1.+G*2.);
  mw*=(1.-dust);
  mw*=mix(1.,.55,G);
  float dm=1.+2.5*band*(1.-dust*.8)+G*2.;
  vec3 st=starLayer(d,40.,.05,pixA,1.,1.)
         +starLayer(d,85.,.05*dm,pixA,2.,.7)
         +starLayer(d,180.,.06*dm,pixA,3.,.5)
         +starLayer(d,380.,.07*dm,pixA,4.,.4);
  st*=mix(1.,.55,dust*.8)*mix(1.,.6,G);
  return mw+st+vec3(.002,.0025,.005)*(.5+cl);
}

/* ---- thin accretion disk, Doppler + gravitational shift (Novikov-Thorne-like temperature) ---- */
vec3 diskEmit(vec3 hp,vec3 v,bool detail,out float dens){
  float rd=length(hp.xz);
  float beta=.82*sqrt(.5/max(rd-1.,.2));
  vec3 tg=vec3(-hp.z,0.,hp.x)/rd;
  float gam=inversesqrt(1.-beta*beta);
  float gd=1./(gam*(1.+beta*dot(tg,v)));
  float gg=sqrt(max(1.-1./rd,.02));
  float g=gd*gg;
  float f=pow(rd/3.,-.75)*pow(max(1.-sqrt(3./rd),.07),.25)/.49;
  float Tobs=6100.*f*pow(g,.55);
  float a=atan(hp.z,hp.x);
  float w=2.6/(rd*sqrt(rd));
  float aa=a-w*u_time;
  vec2 cs=vec2(cos(aa),sin(aa));
  float n1=detail?fbm3(vec3(cs*1.8,rd*5.2),5):fbm3(vec3(cs*1.8,rd*5.2),2);
  float n2=detail?vnoise(vec3(cs*6.,rd*15.+7.)):.5;
  float edge=smoothstep(RIN,RIN+.45,rd)*(1.-smoothstep(ROUT-5.,ROUT,rd));
  float fall=exp(-(rd-RIN)*.1);
  dens=clamp(edge*fall*(.2+1.35*n1)*(.55+.9*n2)*1.15,0.,1.)*u_disk;
  float I=pow(clamp(Tobs/5200.,0.,1.7),2.4)*clamp(pow(g,1.4),.25,1.8);
  return blackbody(Tobs)*I;
}

vec3 trace(vec2 fc){
  vec2 uv=(2.*fc-u_res)/u_res.y;
  vec3 rd=normalize(u_right*uv.x*u_th+u_up*uv.y*u_th+u_fwd);
  float pixA=2.*u_th/u_res.y;
  vec3 p=u_cam/max(u_m,.02),v=rd;
  vec3 col=vec3(0.);float T=1.;
  bool inside=true,hit=false;
  if(length(p)>RB){
    float bb=dot(p,v),cc=dot(p,p)-RB*RB,disc=bb*bb-cc;
    if(disc<0.||bb>0.)inside=false; else p+=v*(-bb-sqrt(disc));
  }
  if(inside){
    vec3 L=cross(p,v);float h2=dot(L,L);
    for(int i=0;i<640;i++){
      if(i>=u_steps)break;
      float r=length(p);
      if(r<1.){hit=true;break;}
      if(r>RB*1.02&&dot(p,v)>0.)break;
      float dt=clamp(.06*(r-.9),.011,2.6);
      float r2=r*r;
      vec3 a=-1.5*h2*p/(r2*r2*r);
      vec3 pm=p+.5*dt*v,vm=v+.5*dt*a;
      float rm=length(pm),rm2=rm*rm;
      vec3 a2=-1.5*h2*pm/(rm2*rm2*rm);
      vec3 vn=normalize(v+a2*dt);
      vec3 pn=p+vm*dt;
      if(u_vol==1&&u_disk>.01){
        float rr=length(p.xz);
        if(rr>RIN&&rr<ROUT){
          float hh=.06+.05*rr,yy=p.y/hh;
          if(abs(yy)<3.){
            float dv=exp(-yy*yy),dn;
            vec3 em=diskEmit(vec3(p.x,0.,p.z),v,false,dn);
            col+=T*em*dn*dv*dt*.22;
            T*=exp(-dv*dn*dt*.45);
          }
        }
      }
      if(p.y*pn.y<0.){
        float tt=p.y/(p.y-pn.y);vec3 hp=mix(p,pn,tt);float rd2=length(hp.xz);
        if(rd2>RIN&&rd2<ROUT){
          float dn;vec3 em=diskEmit(hp,v,true,dn);
          float al=clamp(dn*.96,0.,1.);
          col+=T*em*al*1.25;T*=1.-al;
        }
      }
      p=pn;v=vn;
      if(T<.01)break;
    }
  }
  if(!hit&&T>.01)col+=T*sky(v,pixA);
  return col;
}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec3 c=trace(fc);
  if(u_aa==1)c=.5*(c+trace(fc+vec2(.5,.25)));
  o=vec4(c*u_expo,1.);
}
`;
/* ===================== GLSL: Big Bang plasma, cosmic web, galaxies ===================== */
const FIRE_FS=`
precision highp float;precision highp int;
in vec2 vUV;
uniform vec2 u_res;uniform float u_time,u_th,u_R,u_T,u_dens,u_gain,u_turb,u_cmb,u_rim,u_core,u_shock;
uniform vec3 u_cam,u_right,u_up,u_fwd;
uniform int u_n;
out vec4 o;
`+GLSL_COMMON+`
void main(){
  vec2 uv=(2.*gl_FragCoord.xy-u_res)/u_res.y;
  vec3 rd=normalize(u_right*uv.x*u_th+u_up*uv.y*u_th+u_fwd);
  vec3 ro=u_cam;
  vec3 col=vec3(0.);
  float b=dot(ro,rd),c=dot(ro,ro)-u_R*u_R,disc=b*b-c;
  if(disc>0.&&u_gain>0.){
    float sq=sqrt(disc);
    float t0=max(-b-sq,0.),t1=-b+sq;
    float dt=(t1-t0)/float(u_n);
    float jit=hash21(gl_FragCoord.xy+fract(u_time)*31.);
    float Reff=min(u_R,7.);
    float Tr=1.;
    for(int i=0;i<160;i++){
      if(i>=u_n)break;
      vec3 x=ro+rd*(t0+(float(i)+jit)*dt);
      float s=length(x)/u_R;
      vec3 q=x*(u_turb/max(Reff,.2))+vec3(0.,0.,u_time*.08);
      vec3 w=vec3(fbm3(q*1.7+3.1,3),fbm3(q*1.7+7.7,3),fbm3(q*1.7+1.3,3));
      float n=fbm3(q+(w-.5)*3.2,6);
      float rim=exp(-pow((s-.965)*16.,2.));
      float nn=clamp(n*3.4-1.25,0.,2.2);
      float d=u_dens*(nn*nn*(1.-.5*s)+.08+u_rim*2.2*rim);
      float Tl=u_T*(1.25-.7*s)*(.55+1.0*n)*(1.+u_cmb*(n-.5)*1.6);
      float I=pow(clamp(Tl/5500.,.04,7.),2.1);
      vec3 em=blackbody(Tl)*I*(1.+u_shock*rim*3.);
      col+=Tr*em*d*dt*u_gain;
      Tr*=exp(-d*dt*.9);
      if(Tr<.01)break;
    }
  }
  if(u_core>0.){
    vec3 dO=normalize(-ro);
    float ang=acos(clamp(dot(rd,dO),-1.,1.));
    float g=exp(-ang*ang/(2.*.012*.012))*3.+.0005/(ang*ang+.0003);
    col+=vec3(1.,.93,.82)*g*u_core;
  }
  o=vec4(col,1.);
}
`;

const ZEL=`
const vec3 WK[14]=vec3[14](vec3(1,0,0),vec3(0,1,0),vec3(0,0,1),vec3(1,1,0),vec3(0,1,1),vec3(1,0,1),vec3(1,-1,1),
  vec3(2,1,0),vec3(0,2,1),vec3(1,0,2),vec3(2,-1,2),vec3(3,1,1),vec3(1,3,-2),vec3(2,2,3));
vec3 zel(vec3 q,out float theta){
  vec3 s=vec3(0.);theta=0.;
  for(int i=0;i<14;i++){
    vec3 k=WK[i];float kk=dot(k,k);
    float ph=6.2831853*fract(sin(float(i)*12.9898+1.7)*43758.5453);
    float A=.17/pow(kk,.45);
    float arg=6.2831853*dot(k,q)+ph;
    s+=A*k/kk*sin(arg);
    theta+=6.2831853*A*cos(arg);
  }
  return s;
}
`;

const WEB_VS=`
precision highp float;precision highp int;
uniform mat4 u_vp;uniform vec3 u_cam;
uniform float u_D,u_box,u_pxs,u_bright,u_time,u_stars;
out vec3 vCol;out float vA;
`+GLSL_PCG+ZEL+`
void main(){
  uint id=uint(gl_VertexID);
  vec3 q=vec3(rnd(id,1u),rnd(id,2u),rnd(id,3u));
  float th;vec3 psi=zel(q,th);
  vec3 x=fract(q+u_D*psi);
  vec3 w=(x-.5)*u_box;
  float rho=min(1./max(abs(1.+u_D*th),.13),8.);
  vec4 cp=u_vp*vec4(w,1.);
  gl_Position=cp;
  float dist=max(cp.w,.01);
  float sw=.10+.10*rnd(id,4u);
  float px=clamp(sw*u_pxs/dist,1.6,12.);
  gl_PointSize=px;
  float fog=exp(-dist/(u_box*.75));
  vec3 cold=vec3(.20,.30,.80),hot=vec3(1.,.60,.28);
  vCol=mix(cold,hot,smoothstep(.9,4.5,rho));
  float a=u_bright*pow(rho,.85)*fog*(1.6/px)*(1.6/px)*.5;
  float sp=rnd(id,5u);
  if(u_stars>0.&&rho>3.2&&sp>.82){
    vCol=vec3(.75,.85,1.);gl_PointSize=clamp(px*1.6,3.,9.);a=u_stars*fog*.5;
  }
  vA=a;
}
`;

const GAL_VS=`
precision highp float;precision highp int;
uniform mat4 u_vp;uniform vec3 u_cam,u_camR,u_camU;

void main(){
  uint gid=uint(gl_InstanceID);
  vec2 cq[6]=vec2[6](vec2(-1,-1),vec2(1,-1),vec2(1,1),vec2(-1,-1),vec2(1,1),vec2(-1,1));
  vec2 c=cq[gl_VertexID];
  float bestT=-9.;vec3 q=vec3(0.);
  for(uint k=0u;k<4u;k++){
    vec3 qq=vec3(rnd(gid,10u+k*3u),rnd(gid,11u+k*3u),rnd(gid,12u+k*3u));
    float t;zel(qq,t);
    if(t>bestT){bestT=t;q=qq;}

  float nearFade=smoothstep(se*.6,se*2.2,dist);

const GAL_FS=`
precision highp float;
in vec2 vUV;in float vSeed,vTilt,vAng,vA,vType;out vec4 o;
`+GLSL_COMMON+`
void main(){
  float rr=length(vUV);if(rr>1.)discard;
  vec2 P=rot2(vAng)*vUV;P.y/=vTilt;
  float r=length(P)/.9;
  vec3 col=vec3(0.);
  if(vType<.5){
    float th=atan(P.y,P.x),lr=log(r+.03),ph=th-lr*3.4+vSeed*6.2831;
    float armT=pow(.5+.5*cos(2.*ph),2.2);
    float cloud=fbm3(vec3(P*9.,vSeed*40.),3);
    float disk=exp(-r*3.2)*(1.-exp(-r*14.));
    float bulge=exp(-r*r*45.)*1.4,core=exp(-r*22.)*2.5;
    float lanes=pow(.5+.5*cos(2.*(ph+.55)),5.)*smoothstep(.05,.25,r)*smoothstep(.95,.4,r);
    vec3 cArm=mix(vec3(.42,.56,1.),vec3(.78,.82,1.),cloud);
    col=cArm*disk*(.15+1.5*armT*(.45+cloud))+vec3(1.,.78,.5)*(bulge+core)*.9+vec3(.9,.88,.9)*disk*.12;
    float kn=pow(vnoise(vec3(P*30.,vSeed*9.)),5.)*armT*disk*30.;
    col+=vec3(1.,.66,.52)*kn*.18;
    col*=1.-.7*lanes;
  }else if(vType<1.5){
    float rp=pow(max(r,.012)/.3,.25);
    float prof=min(exp(-7.67*(rp-1.)),60.);
    col=vec3(1.,.80,.56)*prof*.014*smoothstep(1.,.45,r);
  }else{
    float n=fbm3(vec3(P*5.,vSeed*30.),4);
    float v=smoothstep(.42,.78,n)*exp(-r*1.8);
    col=mix(vec3(.5,.65,1.),vec3(.9,.8,.72),vnoise(vec3(P*14.,vSeed*5.)))*v*.55;
  }
  col*=smoothstep(1.,.72,rr);
  o=vec4(col*vA,1.);
}

const MW_COMMON=`
uniform mat4 u_vp;uniform vec3 u_cam;
uniform float u_g,u_rot,u_pxs,u_bright,u_time;
`+GLSL_PCG+`
#define PI 3.14159265
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s, 0.,1.,0., s,0.,c);}
vec3 rdir(uint id,uint k){float z=rnd(id,k)*2.-1.,ph=rnd(id,k+1u)*2.*PI;float s=sqrt(max(1.-z*z,0.));return vec3(s*cos(ph),z,s*sin(ph));}
float gauss(uint id,uint k){return (rnd(id,k)+rnd(id,k+1u)+rnd(id,k+2u)-1.5)*2.;}
float armTheta(float r,float armIdx){return log(max(r,.6)/1.6)*4.2+armIdx*PI*.5;}
float pickArm(float u){return u<.34?0.:(u<.68?2.:(u<.84?1.:3.));}
`;
const MW_VS=`
precision highp float;precision highp int;
`+MW_COMMON+`
out vec3 vCol;out float vA;
vec3 bbv(float T){T=clamp(T,1000.,40000.)/100.;vec3 c;
  c.r=T<=66.?1.:clamp(1.292936186*pow(T-60.,-.1332047592),0.,1.);
  c.g=T<=66.?clamp(.3900815788*log(T)-.6318414438,0.,1.):clamp(1.129890861*pow(T-60.,-.0755148492),0.,1.);
  c.b=T>=66.?1.:(T<=19.?0.:clamp(.5432067891*log(T-10.)-1.19625408914,0.,1.));
  return pow(c,vec3(2.2));}
void main(){
  uint id=uint(gl_VertexID);
  float t=rnd(id,1u);
  vec3 fin,start;float T,br;float sz=1.;
  float rxz;
  if(t<.17){
    float u=rnd(id,2u),su=sqrt(u);
    float rb=min(.9*su/max(1.-su,.02),7.);
    vec3 d=rdir(id,3u);
    fin=rb*vec3(d.x*1.6,d.y*.7,d.z*.85);
    T=mix(3300.,5600.,rnd(id,6u));br=.85;
  }else if(t<.80){
    float r=-3.1*(log(max(rnd(id,2u),1e-4))+log(max(rnd(id,3u),1e-4)));if(r>19.)r=mod(r,19.);
    bool inArm=rnd(id,5u)<.74;
    float th;
    if(inArm){th=armTheta(r,pickArm(rnd(id,6u)))+gauss(id,7u)*(.34+.006*r);}
    else th=rnd(id,6u)*2.*PI;
    float y=((rnd(id,9u)>.5)?1.:-1.)*(-log(max(1.-rnd(id,8u),1e-4)))*.17*(1.+r*.03);
    fin=vec3(r*cos(th),y,r*sin(th));
    bool young=inArm&&rnd(id,10u)<.42;
    T=young?mix(7500.,11500.,rnd(id,11u)):mix(4800.,7200.,rnd(id,11u));
    br=young?1.1:.75;
  }else if(t<.90){
    float rh=2.+24.*pow(rnd(id,2u),.6);
    fin=rdir(id,3u)*rh*vec3(1.,.8,1.);
    T=mix(3800.,5000.,rnd(id,6u));br=.5;
  }else{
    float rh=3.+10.*rnd(id,2u);
    fin=rdir(id,3u)*rh*vec3(1.,.3,1.);
    T=mix(4200.,6000.,rnd(id,6u));br=.6;
  }
  rxz=length(fin.xz);
  if(t>=.90){
    uint s=uint(floor(rnd(id,20u)*6.));
    vec3 cen=26.*rdir(s+900u,1u)*vec3(1.,.5,1.);
    start=cen+1.5*vec3(gauss(id,21u),gauss(id,24u),gauss(id,27u));
  }else{
    vec3 d=rdir(id,12u);
    if(rnd(id,15u)<.4){
      uint s=uint(floor(rnd(id,16u)*10.));
      start=11.*rdir(s+500u,1u)+2.4*vec3(gauss(id,17u),gauss(id,30u),gauss(id,33u));
    }else start=16.*pow(rnd(id,14u),.45)*d;
  }
  float delay=rnd(id,40u)*.45;
  float gp=clamp((u_g-delay)/.55,0.,1.);
  float e=gp*gp*(3.-2.*gp);
  float sw=4.2*(1.+3./(1.+rxz));
  vec3 pos=rotY((1.-e)*sw)*mix(start,fin,e);
  pos=rotY(u_rot)*pos;
  vec4 cp=u_vp*vec4(pos,1.);
  gl_Position=cp;
  float dist=max(cp.w,.01);
  float big=rnd(id,50u)>.985?1.:0.;
  float px=clamp((.075+.05*big)*u_pxs/dist,1.25,7.);
  gl_PointSize=px;
  float ign=smoothstep(.15,1.,gp);
  vec3 col=mix(bbv(2300.)*.35,bbv(T),ign);
  float b=br*mix(.18,1.,ign)*(1.+big*5.)*(.5+rnd(id,51u));
  vCol=col;
  vA=u_bright*b*(1.3/px)*(1.3/px)*(.45+.55*smoothstep(.0,.25,u_g+delay*.0));
}
`;

const POST_FS=`
precision highp float;in vec2 vUV;

void main(){

  vec2 uv=vUV,cc=uv-.5;float rr=dot(cc,cc);

/* ============================ RENDERER ============================ */
const MAXPT=Math.min(140,gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1]);
const P={};
function buildPrograms(){
  P.bh  =program(FS_TRI,BH_FS,'blackhole');
  P.fire=program(FS_TRI,FIRE_FS,'fireball');
  P.web =program(WEB_VS,WEB_FS,'web');
  P.gal =program(GAL_VS,GAL_FS,'galaxies');
  P.mw  =program(MW_VS,MW_FS,'milkyway');
  P.dust=program(DUST_VS,DUST_FS,'dust','#define MAXPT '+MAXPT.toFixed(1)+'\n');
  P.down=program(FS_TRI,DOWN_FS,'down');
  P.up  =program(FS_TRI,UP_FS,'up');
  P.post=program(FS_TRI,POST_FS,'post');
}
const u1f=(pr,n,v)=>{const l=pr.U[n];if(l!==undefined&&l!==null)gl.uniform1f(l,v);};
const u1i=(pr,n,v)=>{const l=pr.U[n];if(l!==undefined&&l!==null)gl.uniform1i(l,v);};
const u2f=(pr,n,a,b)=>{const l=pr.U[n];if(l)gl.uniform2f(l,a,b);};
const u3v=(pr,n,v)=>{const l=pr.U[n];if(l)gl.uniform3f(l,v[0],v[1],v[2]);};
const um4=(pr,n,m)=>{const l=pr.U[n];if(l)gl.uniformMatrix4fv(l,false,m);};

let hdr=null,bloomRT=[],cw=1,ch=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,Q.dpr);
  cw=Math.max(2,Math.floor(innerWidth*dpr));ch=Math.max(2,Math.floor(innerHeight*dpr));
  canvas.width=cw;canvas.height=ch;
  freeRT(hdr);bloomRT.forEach(freeRT);bloomRT=[];
  hdr=createRT(cw*Q.scale,ch*Q.scale,true);
  let w=hdr.w>>1,h=hdr.h>>1;
  for(let i=0;i<Q.bloom;i++){bloomRT.push(createRT(Math.max(2,w),Math.max(2,h),true));w>>=1;h>>=1;}
}
function makeCam(eye,target,fovDeg,near,far){
  const L=M.look(eye,target,[0,1,0]);
  const f=fovDeg*Math.PI/180,asp=hdr.w/hdr.h;
  const pr=M.persp(f,asp,near||.05,far||600);
  const th=Math.tan(f/2);
  return {eye,vp:M.mul(pr,L.m),right:L.right,up:L.up,fwd:L.fwd,th,pxs:hdr.h/(2*th)};
}
const fsq=()=>{gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLES,0,3);};

function bloomChain(){
  if(!Q.bloom||!bloomRT.length)return false;
  gl.disable(gl.BLEND);
  let src=hdr;gl.useProgram(P.down.p);gl.activeTexture(gl.TEXTURE0);gl.uniform1i(P.down.U.u_src,0);
  for(let i=0;i<bloomRT.length;i++){
    const d=bloomRT[i];gl.bindFramebuffer(gl.FRAMEBUFFER,d.fb);gl.viewport(0,0,d.w,d.h);
    gl.bindTexture(gl.TEXTURE_2D,src.tex);u2f(P.down,'u_texel',1/src.w,1/src.h);u1i(P.down,'u_first',i===0?1:0);
    fsq();src=d;
  }
  gl.useProgram(P.up.p);gl.uniform1i(P.up.U.u_src,0);additive();
  for(let i=bloomRT.length-1;i>=1;i--){
    const s=bloomRT[i],d=bloomRT[i-1];

}

function cosmicLog(b){
  if(b<=KF[0][0])return KF[0][1];
  for(let i=1;i<KF.length;i++)if(b<=KF[i][0]){const a=KF[i-1],c=KF[i];return a[1]+(c[1]-a[1])*M.ease((b-a[0])/(c[0]-a[0]));}
  return KF[KF.length-1][1];
}
function fmtCosmic(L){
  const s=Math.pow(10,L);
  if(L<-3)return '10'+sup(Math.round(L))+' s';
  if(s<120)return (s<10?s.toFixed(1):s.toFixed(0))+' s';
  if(s<7200)return (s/60).toFixed(0)+' min';
  const y=s/3.156e7;
  if(y<1)return (s/86400).toFixed(0)+' days';
  if(y<1e3)return y.toFixed(0)+' years';
  if(y<1e6)return (y/1e3).toFixed(0)+',000 years';
  if(y<1e9)return (y/1e6).toFixed(0)+' million years';
  return (y/1e9).toFixed(1)+' billion years';
}

const AU={ctx:null,master:null,drone:null,pad:null,shimmer:null,noiseBuf:null,on:true};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=AU.ctx=new C();
    const comp=c.createDynamicsCompressor();comp.connect(c.destination);
    AU.master=c.createGain();AU.master.gain.value=AU.on?.8:0;AU.master.connect(comp);
    const nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=nb.getChannelData(0);let l=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=l*.96+w*.04;d[i]=l*6;}
    AU.noiseBuf=nb;
    AU.drone=c.createGain();AU.drone.gain.value=0;AU.drone.connect(AU.master);
    const sub=c.createOscillator();sub.frequency.value=43.2;const sg=c.createGain();sg.gain.value=.55;sub.connect(sg).connect(AU.drone);sub.start();
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=230;lp.Q.value=3;lp.connect(AU.drone);
    [86.4,87.3,129.6].forEach((f,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const g=c.createGain();g.gain.value=i<2?.12:.05;o.connect(g).connect(lp);o.start();});
    const ns=c.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=1.2;
    const ng=c.createGain();ng.gain.value=.05;ns.connect(bp).connect(ng).connect(AU.drone);ns.start();
    const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=140;lfo.connect(lg).connect(lp.frequency);lfo.start();
    AU.pad=c.createGain();AU.pad.gain.value=0;const plp=c.createBiquadFilter();plp.type='lowpass';plp.frequency.value=500;plp.connect(AU.pad);AU.pad.connect(AU.master);AU.padF=plp;
    [55,82.41,110,164.81,220,329.63].forEach((f,i)=>{[-1,1].forEach(s=>{const o=c.createOscillator();o.type=i<2?'sine':'triangle';o.frequency.value=f*(1+s*.0018);
      const g=c.createGain();g.gain.value=.22/(1+i*.35);o.connect(g).connect(plp);o.start();});});
    AU.shimmer=c.createGain();AU.shimmer.gain.value=0;AU.shimmer.connect(AU.master);
    [440,659.25,880,1318.5].forEach(f=>{const o=c.createOscillator();o.frequency.value=f;const g=c.createGain();g.gain.value=.05;o.connect(g).connect(AU.shimmer);o.start();});
    AU.drone.gain.setTargetAtTime(.9,c.currentTime,1.5);
  }catch(e){console.warn('audio unavailable',e);}
}
function auNoise(t,dur,f0,f1,gain,type){
  const c=AU.ctx;const s=c.createBufferSource();s.buffer=AU.noiseBuf;s.loop=true;
  const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(f).connect(g).connect(AU.master);s.start(t);s.stop(t+dur+.1);
}
function auSequence(){
  if(!AU.ctx)return;const c=AU.ctx,t0=c.currentTime,tb=t0+TB;
  // collapse: riser while the drone is swallowed
  const r=c.createOscillator(),rg=c.createGain();r.type='sine';r.frequency.setValueAtTime(50,t0);r.frequency.exponentialRampToValueAtTime(900,t0+1.2);
  rg.gain.setValueAtTime(0,t0);rg.gain.linearRampToValueAtTime(.3,t0+1.1);rg.gain.linearRampToValueAtTime(0,t0+1.25);r.connect(rg).connect(AU.master);r.start(t0);r.stop(t0+1.3);
  AU.drone.gain.cancelScheduledValues(t0);AU.drone.gain.setValueAtTime(AU.drone.gain.value,t0);AU.drone.gain.linearRampToValueAtTime(0,t0+1.2);
  // 5 s of absolute silence, then the bang
  const boom=c.createOscillator(),bg=c.createGain();boom.frequency.setValueAtTime(120,tb);boom.frequency.exponentialRampToValueAtTime(20,tb+7);
  bg.gain.setValueAtTime(0,tb-.01);bg.gain.setValueAtTime(1.1,tb);bg.gain.exponentialRampToValueAtTime(.001,tb+10);boom.connect(bg).connect(AU.master);boom.start(tb);boom.stop(tb+10.5);
  auNoise(tb,.5,16000,3000,1.2,'lowpass');
  auNoise(tb,11,9000,90,.9,'lowpass');
  // afterglow pad: the universe cools
  AU.padF.frequency.setValueAtTime(300,tb);AU.padF.frequency.linearRampToValueAtTime(1500,tb+70);
  AU.pad.gain.setValueAtTime(0,tb+6);AU.pad.gain.linearRampToValueAtTime(.2,tb+34);
  AU.shimmer.gain.setValueAtTime(0,tb+60);AU.shimmer.gain.linearRampToValueAtTime(.06,tb+90);
  AU.pad.gain.linearRampToValueAtTime(.12,tb+130);AU.shimmer.gain.linearRampToValueAtTime(.015,tb+138);
  AU.drone.gain.setValueAtTime(0,tb+120);AU.drone.gain.linearRampToValueAtTime(.95,tb+140);

function auRestart(){

/* ============================ SCENE DIRECTOR ============================ */
const lerp=M.mix,sst=M.sstep,ez=M.ease;
function renderScene(){
  beginScene();
  const o={expo:1,black:false,flash:0,bloom:.38};
  if(mode==='home'||mode==='final'){
    drawBH(makeCam(bhEye(orb.yaw,orb.pitch,orb.dist),[0,0,0],BH_FOV),{time,m:1,gal:mode==='final'?1:0,expo:1,disk:1});
    o.bloom=.1;return o;
  }
  const t=seqT;
  if(t<1.2){                                   // the home black hole is pulled in and swallowed
    const k=ez(t/1.2);
    drawBH(makeCam(bhEye(orb.yaw+k*.9,orb.pitch,orb.dist*(1-.5*k)),[0,0,0],BH_FOV),{time,m:1,gal:0,expo:1-k,disk:1});
    return o;
  }
  if(t<TB){o.black=true;return o;}             // 5.0 s of absolute darkness
  const b=t-TB;
  if(b<24){                                    // ---- Big Bang fireball ----
    const R=b<1.38?.003*Math.exp(b*4.2):1+4*(1-Math.exp(-(b-1.38)*.5));
    let T=3000+57000*Math.exp(-b/3.2);if(b>16)T*=Math.max(.45,1-(b-16)*.07);
    const cam=makeCam(bhEye(.5+.12*b,.25,12),[0,0,0],50);
    drawFire(cam,{time,R,T,dens:.8,gain:(b<16?1:1-sst(16,24,b))*.3*Math.min(1,Math.pow(8000/T,1.2)),turb:3.2,cmb:sst(9,16,b)*1.1,rim:1.2*Math.exp(-b/2.2),
      core:b<3.5?1.8*Math.exp(-b*.8):0,shock:Math.exp(-b/1.5)});
    o.expo=.8;
    o.flash=b<.7?Math.pow(1-b/.7,2)*1.3:0;
  }
  if(b>=20&&b<67.5){                           // ---- dark ages, cosmic web, galaxies ----
    const D=.05+2.0*M.clamp((b-20)/48,0,1);
    const fade=1-ez((b-63)/3.5);
    const eye=[18*Math.sin(.045*b),8*Math.sin(.031*b+1),-28+.8*(b-20)];
    const tb=b+3,tg=[18*Math.sin(.045*tb),8*Math.sin(.031*tb+1),-28+.8*(tb-20)];
    const cam=makeCam(eye,tg,55);
    drawWeb(cam,{D,box:90,bright:sst(21,28,b)*fade,time,stars:sst(28,40,b)*.9*fade});
    if(b>=34)drawGal(cam,{D,box:90,gsize:1.6,vis:sst(34,66,b),bright:.9*fade});
    o.expo=1.0;
  }
  if(b>=67){                                   // ---- Milky Way assembles, then the central black hole forms ----
    const fin=ez((b-67)/4);
    const g=M.clamp((b-70)/42,0,1);
    const s=ez((b-70)/42);
    let yaw=.12*(b-67),pitch=lerp(1.0,.5,s),dist=lerp(46,36,s);
    const f=ez((b-112)/20);
    dist=dist*Math.pow(1.8/dist,f);pitch=lerp(pitch,.12,f);
    const bhk=sst(130,137,b);
    if(bhk>0){
      drawBH(makeCam(bhEye(orb.yaw,orb.pitch,orb.dist),[0,0,0],BH_FOV),
        {time,m:ez((b-131)/9)*.98+.02*ez((b-131)/9),gal:1,expo:bhk,disk:sst(138,144,b)});
    }
    const cam=makeCam(bhEye(yaw,pitch,dist),[0,0,0],50,.03,300);
    drawMW(cam,{g,rot:.05*(b-70),bright:fin*(1-bhk),time});
    o.expo=1.0;o.bloom=lerp(.22,.1,bhk);
  }
  return o;
}
function updateHUD(){
  if(mode!=='seq'){return;}
  const b=seqT-TB;
  if(b<0){el.clockv.textContent='—';setCaption(-1,'','');return;}
  el.clockv.textContent=fmtCosmic(cosmicLog(b));
  let idx=0;for(let i=0;i<CH.length;i++)if(b>=CH[i][0]+.2)idx=i;
  setCaption(idx,CH[idx][1],CH[idx][2]);
}
let FREEZE=false;
let fpsAcc=0,fpsN=0,fpsShow=0,fpsLowFor=0;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=(now-last)/1000,dt=Math.min(.25,rawDt);last=now;time+=dt;
  if(mode==='seq'){if(!FREEZE)seqT+=dt;if(seqT>=TB+END_B)goFinal();}
  else if(!drag)orb.yaw+=dt*.025;
  updateHUD();
  const o=renderScene();o.time=time;
  present(o);
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>.5){
    fpsShow=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    el.fps.textContent=fpsShow.toFixed(0)+' FPS · '+hdr.w+'×'+hdr.h;
    if(fpsShow<20&&(qKey==='high'||qKey==='extreme')){fpsLowFor+=.5;if(fpsLowFor>6)el.gdesc.textContent='Low frame rate detected — try a lower preset for smoother playback.';}
    else fpsLowFor=Math.max(0,fpsLowFor-.5);
  }
}

/* ============================ BOOT ============================ */
try{
  buildPrograms();
  const H=location.hash.replace('#','').split('&').reduce((a,s)=>{const [k,v]=s.split('=');if(k)a[k]=v;return a;},{});
  if(H.q&&QUALITY[H.q])qKey=H.q;
  setQuality(qKey);
  if(H.t!==undefined){startSeq(parseFloat(H.t)||0);if(parseFloat(H.t)>0)el.home.classList.add('hide');}
  if(H.final)goFinal();
  FREEZE=!!H.freeze;
  window.__genesis={get mode(){return mode;},set seqT(v){seqT=v;},get seqT(){return seqT;},go:startSeq,Q:()=>Q};
  requestAnimationFrame(t=>{last=t;frame(t);});
}catch(err){console.error(err);fatal('Rendering could not start.\n\n'+(err&&err.message?err.message:err));}
</script>
